# Theme
remote_theme: mmistakes/minimal-mistakes@4.26.2
plugins:
  - jekyll-include-cache
  - jekyll-seo-tag

# Site Settings
locale: "en-US"
title: "Morenikeji Adeleke"
title_separator: "·"
subtitle: "Cybersecurity Portfolio"
name: "Morenikeji Adeleke"
description: "Cybersecurity professional specializing in security operations, cloud security, and IT risk management. Experienced in Wazuh SIEM, Fortinet, Microsoft Entra ID, AWS, and penetration testing."
url: "https://adepeju02.github.io"
baseurl: ""

# SEO
twitter:
  username: ""
og_image: "/assets/images/avatar.png"

# Appearance
minimal_mistakes_skin: "mint"

# Author
author:
  name: "Morenikeji \"PJ\" Adeleke"
  avatar: "/assets/images/avatar.png"
  bio: "Securing Corporate Networks & Cloud Infrastructure<br><br>IT Support & Security"
  location: "Ontario, Canada"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/adepeju-adeleke/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/adepeju02"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:PJ.Adeleke@MyGeorgian.ca"

# Navigation
navigation: main
collections:
  pages:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true

# Markdown
markdown: kramdown
highlighter: rouge

# Exclude from processing
exclude:
  - "*.gemspec"
  - "*.gem"
  - Gemfile
  - Gemfile.lock
  - vendor

# Reading Files
include:
  - _pages

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: America/Toronto
